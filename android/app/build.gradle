plugins {
    id 'com.android.application'
}

// The signing key stays out of the repository. Without one, a release build comes out unsigned.
def hasKey = project.hasProperty('fruitSlicerKeystore')

android {
    namespace = "com.realanxiousgit.fruitslicer"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.realanxiousgit.fruitslicer"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 6
        versionName "1.1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                // gradlew assembleRelease -PdevTools: developer tools in Options. Never for releases.
                if (project.hasProperty('devTools')) arguments "-DDEV_TOOLS=ON"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                targets "main"
            }
        }
    }
    if (hasKey) {
        signingConfigs {
            release {
                storeFile file(fruitSlicerKeystore)
                storePassword fruitSlicerKeyPassword
                keyAlias "fruitslicer"
                keyPassword fruitSlicerKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasKey) signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version "3.22.1"
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir("gameAssets")
    lint {
        abortOnError = false
    }
}

// The game looks for romfs/ inside the APK, the same folder the desktop builds keep beside the game.
// The Ultra art (gfx4k, tex4k) stays out: a phone screen is already sharp with the normal art.
tasks.register('copyGameAssets', Copy) {
    from('../../romfs') {
        exclude 'gfx4k/**', 'tex4k/**'
    }
    into(layout.buildDirectory.dir("gameAssets/romfs"))
}
preBuild.dependsOn copyGameAssets
